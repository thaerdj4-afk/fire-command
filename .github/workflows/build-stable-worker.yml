name: Build stable signed worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check worker security
        run: python3 security/check_worker.py
      - name: Restore private signing key
        env:
          ANDROID_SIGNING_JSON: ${{ secrets.ANDROID_SIGNING_JSON }}
        run: python3 security/restore-signing.py
      - name: Build signed release
        working-directory: android-app
        run: |
          mkdir -p app/src/main/assets
          cp ../worker.html app/src/main/assets/worker.html
          sha256sum ../worker.html > app/src/main/assets/worker-source.sha256
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle --no-daemon assembleRelease lint
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Worker-Stable-v23
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-release.jks"
