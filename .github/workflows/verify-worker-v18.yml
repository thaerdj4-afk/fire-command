name: Verify existing worker v18 APK on Android 16
on:
  push:
    branches: [worker-security-staging]
    paths: [.github/workflows/verify-worker-v18.yml]
permissions:
  contents: read
  actions: read
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fire-Command-Worker-SECURITY-STAGING-54b1bbb3348d874fd5e70d70bc79a299bdde004c
          run-id: 38624587659
          github-token: ${{ github.token }}
          path: staging-build
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash security/tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-v18-verified-smoke-${{ github.sha }}
          path: smoke-evidence/
