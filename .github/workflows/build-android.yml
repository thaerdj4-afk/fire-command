name: Test secure worker staging
on:
  workflow_dispatch:
  push:
    branches: [worker-security-staging]
permissions:
  contents: read
jobs:
  test-build:
    if: github.ref == 'refs/heads/worker-security-staging' && !contains(github.event.head_commit.message, '[verify-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Worker security gate
        run: python3 security/check_worker.py
      - name: Browser regression tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Embed exact branch worker
        run: |
          mkdir -p android-app/app/src/main/assets
          cp worker.html android-app/app/src/main/assets/worker.html
          sha256sum worker.html > android-app/app/src/main/assets/worker-source.sha256
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and lint isolated TEST APK and unsigned AAB
        working-directory: android-app
        run: gradle --no-daemon assembleDebug bundleRelease lint --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Fire-Command-Worker-SECURITY-STAGING-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/reports/lint-results*.html
          if-no-files-found: error
  android-smoke:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fire-Command-Worker-SECURITY-STAGING-${{ github.sha }}
          path: staging-build
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 clean-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash security/tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-36-smoke-evidence-${{ github.sha }}
          path: smoke-evidence/
          if-no-files-found: warn
