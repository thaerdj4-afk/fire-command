name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/firecommand/worker

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FireCommandWorker"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.firecommand.worker'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.firecommand.worker'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:label="חפ״ק שריפה - עובד"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".LocationService"
                      android:exported="false"
                      android:foregroundServiceType="location"/>

              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/firecommand/worker/MainActivity.java <<'EOF'
          package com.firecommand.worker;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private EditText eventField;
              private EditText nameField;
              private LinearLayout login;
              private WebView web;

              private String eventId = "";
              private String workerName = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root.setBackgroundColor(Color.rgb(245, 246, 248));

                  login = new LinearLayout(this);
                  login.setOrientation(LinearLayout.VERTICAL);
                  login.setPadding(40, 55, 40, 35);

                  TextView title = new TextView(this);
                  title.setText("🔥 חפ״ק שריפה – אפליקציית עובד");
                  title.setTextSize(25);
                  title.setGravity(Gravity.CENTER);
                  login.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText(
                      "\nהתחברות לאירוע ושיתוף מיקום חי עם החפ״ק\n"
                  );
                  sub.setTextSize(16);
                  sub.setGravity(Gravity.CENTER);
                  login.addView(sub);

                  eventField = new EditText(this);
                  eventField.setHint(
                      "הדבק קישור עובד או מזהה אירוע"
                  );
                  login.addView(eventField);

                  nameField = new EditText(this);
                  nameField.setHint("שם העובד");
                  login.addView(nameField);

                  Button enter = new Button(this);
                  enter.setText("🔥 כניסה לאירוע");
                  login.addView(enter);

                  root.addView(login);

                  web = new WebView(this);
                  web.setVisibility(View.GONE);

                  root.addView(
                      web,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  enter.setOnClickListener(
                      v -> prepare()
                  );
              }

              private String parseEvent(String raw) {

                  raw = raw.trim();

                  try {

                      Uri uri = Uri.parse(raw);

                      String e =
                          uri.getQueryParameter("event");

                      if (
                          e != null &&
                          !e.trim().isEmpty()
                      ) {
                          return e.trim();
                      }

                  } catch (Exception ignored) {}

                  return raw;
              }

              private void prepare() {

                  eventId =
                      parseEvent(
                          eventField
                              .getText()
                              .toString()
                      );

                  workerName =
                      nameField
                          .getText()
                          .toString()
                          .trim();

                  if (
                      eventId.isEmpty() ||
                      workerName.isEmpty()
                  ) {

                      Toast.makeText(
                          this,
                          "יש להזין אירוע ושם עובד",
                          Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  if (
                      Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(
                          Manifest.permission
                              .ACCESS_FINE_LOCATION
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission
                                  .ACCESS_FINE_LOCATION,
                              Manifest.permission
                                  .ACCESS_COARSE_LOCATION
                          },
                          100
                      );

                      return;
                  }

                  startEverything();
              }

              private void startEverything() {

                  if (
                      Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(
                          Manifest.permission
                              .POST_NOTIFICATIONS
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission
                                  .POST_NOTIFICATIONS
                          },
                          101
                      );
                  }

                  Intent service =
                      new Intent(
                          this,
                          LocationService.class
                      );

                  service.putExtra(
                      "event",
                      eventId
                  );

                  service.putExtra(
                      "name",
                      workerName
                  );

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(service);
                  } else {
                      startService(service);
                  }

                  login.setVisibility(View.GONE);
                  web.setVisibility(View.VISIBLE);

                  WebSettings settings =
                      web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);

                  web.setWebViewClient(
                      new WebViewClient()
                  );

                  String url =
                      "https://thaerdj4-afk.github.io/fire-command/worker.html?event="
                      + Uri.encode(eventId)
                      + "&name="
                      + Uri.encode(workerName);

                  web.loadUrl(url);
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] results
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      results
                  );

                  if (
                      requestCode == 100 &&
                      results.length > 0 &&
                      results[0]
                      ==
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      startEverything();
                  }
              }

              @Override
              public void onBackPressed() {

                  if (
                      web != null &&
                      web.getVisibility()
                          == View.VISIBLE &&
                      web.canGoBack()
                  ) {

                      web.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > android-app/app/src/main/java/com/firecommand/worker/LocationService.java <<'EOF'
          package com.firecommand.worker;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.IBinder;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class LocationService
              extends Service
              implements LocationListener {

              private static final String CHANNEL =
                  "fire_worker_location";

              private static final String SUPABASE =
                  "https://jvubjwzzikfwsektifzi.supabase.co";

              private static final String KEY =
                  "sb_publishable_2sysk85O-l18YM_EAIaMJg_RAks_tpW";

              private LocationManager manager;

              private final ExecutorService executor =
                  Executors.newSingleThreadExecutor();

              private String eventId = "";
              private String workerName = "";
              private String workerId = null;

              @Override
              public void onCreate() {

                  super.onCreate();

                  createChannel();
              }

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId
              ) {

                  if (intent != null) {

                      String e =
                          intent.getStringExtra(
                              "event"
                          );

                      String n =
                          intent.getStringExtra(
                              "name"
                          );

                      if (e != null) {
                          eventId = e.trim();
                      }

                      if (n != null) {
                          workerName = n.trim();
                      }

                      getSharedPreferences(
                          "worker",
                          MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          "event",
                          eventId
                      )
                      .putString(
                          "name",
                          workerName
                      )
                      .apply();

                  } else {

                      eventId =
                          getSharedPreferences(
                              "worker",
                              MODE_PRIVATE
                          )
                          .getString(
                              "event",
                              ""
                          );

                      workerName =
                          getSharedPreferences(
                              "worker",
                              MODE_PRIVATE
                          )
                          .getString(
                              "name",
                              ""
                          );
                  }

                  startForeground(
                      7001,
                      notification(
                          "מתחבר ל-GPS..."
                      )
                  );

                  executor.execute(
                      this::findOrCreateWorker
                  );

                  startGps();

                  return START_STICKY;
              }

              private void startGps() {

                  if (
                      checkSelfPermission(
                          Manifest.permission
                              .ACCESS_FINE_LOCATION
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                      &&
                      checkSelfPermission(
                          Manifest.permission
                              .ACCESS_COARSE_LOCATION
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      stopSelf();
                      return;
                  }

                  manager =
                      (LocationManager)
                          getSystemService(
                              LOCATION_SERVICE
                          );

                  try {

                      if (
                          manager.isProviderEnabled(
                              LocationManager
                                  .GPS_PROVIDER
                          )
                      ) {

                          manager.requestLocationUpdates(
                              LocationManager
                                  .GPS_PROVIDER,
                              5000,
                              2,
                              this
                          );
                      }

                  } catch (Exception ignored) {}

                  try {

                      if (
                          manager.isProviderEnabled(
                              LocationManager
                                  .NETWORK_PROVIDER
                          )
                      ) {

                          manager.requestLocationUpdates(
                              LocationManager
                                  .NETWORK_PROVIDER,
                              7000,
                              3,
                              this
                          );
                      }

                  } catch (Exception ignored) {}
              }

              @Override
              public void onLocationChanged(
                  Location location
              ) {

                  double lat =
                      location.getLatitude();

                  double lng =
                      location.getLongitude();

                  executor.execute(() -> {

                      if (workerId == null) {
                          findOrCreateWorker();
                      }

                      if (workerId != null) {
                          updateLocation(
                              lat,
                              lng
                          );
                      }
                  });
              }

              private void findOrCreateWorker() {

                  if (
                      eventId.isEmpty() ||
                      workerName.isEmpty()
                  ) {
                      return;
                  }

                  HttpURLConnection c = null;

                  try {

                      String endpoint =
                          SUPABASE
                          + "/rest/v1/workers"
                          + "?event_id=eq."
                          + URLEncoder.encode(
                              eventId,
                              "UTF-8"
                          )
                          + "&name=eq."
                          + URLEncoder.encode(
                              workerName,
                              "UTF-8"
                          )
                          + "&select=id,status"
                          + "&order=created_at.desc"
                          + "&limit=10";

                      c = connection(
                          endpoint,
                          "GET"
                      );

                      int code =
                          c.getResponseCode();

                      if (
                          code >= 200 &&
                          code < 300
                      ) {

                          JSONArray rows =
                              new JSONArray(
                                  read(c)
                              );

                          for (
                              int i = 0;
                              i < rows.length();
                              i++
                          ) {

                              JSONObject row =
                                  rows.getJSONObject(i);

                              if (
                                  !"סיים".equals(
                                      row.optString(
                                          "status"
                                      )
                                  )
                              ) {

                                  workerId =
                                      row.optString(
                                          "id",
                                          null
                                      );

                                  break;
                              }
                          }
                      }

                  } catch (Exception ignored) {

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }

                  if (workerId == null) {
                      createWorker();
                  }
              }

              private void createWorker() {

                  HttpURLConnection c = null;

                  try {

                      c = connection(
                          SUPABASE
                          + "/rest/v1/workers",
                          "POST"
                      );

                      c.setRequestProperty(
                          "Prefer",
                          "return=representation"
                      );

                      JSONObject body =
                          new JSONObject();

                      body.put(
                          "event_id",
                          eventId
                      );

                      body.put(
                          "name",
                          workerName
                      );

                      body.put(
                          "status",
                          "פעיל"
                      );

                      write(
                          c,
                          body.toString()
                      );

                      int code =
                          c.getResponseCode();

                      if (
                          code >= 200 &&
                          code < 300
                      ) {

                          JSONArray rows =
                              new JSONArray(
                                  read(c)
                              );

                          if (
                              rows.length() > 0
                          ) {

                              workerId =
                                  rows
                                      .getJSONObject(0)
                                      .optString(
                                          "id",
                                          null
                                      );
                          }
                      }

                  } catch (Exception ignored) {

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              private void updateLocation(
                  double lat,
                  double lng
              ) {

                  HttpURLConnection c = null;

                  try {

                      String endpoint =
                          SUPABASE
                          + "/rest/v1/workers?id=eq."
                          + URLEncoder.encode(
                              workerId,
                              "UTF-8"
                          );

                      c = connection(
                          endpoint,
                          "PATCH"
                      );

                      c.setRequestProperty(
                          "Prefer",
                          "return=minimal"
                      );

                      JSONObject body =
                          new JSONObject();

                      body.put(
                          "latitude",
                          lat
                      );

                      body.put(
                          "longitude",
                          lng
                      );

                      body.put(
                          "location_updated_at",
                          new SimpleDateFormat(
                              "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
                              Locale.US
                          ).format(
                              new Date()
                          )
                      );

                      write(
                          c,
                          body.toString()
                      );

                      int code =
                          c.getResponseCode();

                      if (
                          code >= 200 &&
                          code < 300
                      ) {

                          updateNotification(
                              "🟢 מיקום חי מחובר לחפ״ק"
                          );
                      }

                  } catch (Exception ignored) {

                  } finally {

                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              private HttpURLConnection connection(
                  String address,
                  String method
              ) throws Exception {

                  HttpURLConnection c =
                      (HttpURLConnection)
                          new URL(address)
                              .openConnection();

                  c.setRequestMethod(method);

                  c.setConnectTimeout(15000);
                  c.setReadTimeout(15000);

                  c.setRequestProperty(
                      "apikey",
                      KEY
                  );

                  c.setRequestProperty(
                      "Authorization",
                      "Bearer " + KEY
                  );

                  c.setRequestProperty(
                      "Content-Type",
                      "application/json"
                  );

                  if (
                      "POST".equals(method) ||
                      "PATCH".equals(method)
                  ) {

                      c.setDoOutput(true);
                  }

                  return c;
              }

              private void write(
                  HttpURLConnection c,
                  String data
              ) throws Exception {

                  try (
                      OutputStream out =
                          c.getOutputStream()
                  ) {

                      out.write(
                          data.getBytes(
                              StandardCharsets.UTF_8
                          )
                      );
                  }
              }

              private String read(
                  HttpURLConnection c
              ) throws Exception {

                  BufferedReader reader =
                      new BufferedReader(
                          new InputStreamReader(
                              c.getInputStream(),
                              StandardCharsets.UTF_8
                          )
                      );

                  StringBuilder data =
                      new StringBuilder();

                  String line;

                  while (
                      (line = reader.readLine())
                      != null
                  ) {

                      data.append(line);
                  }

                  return data.toString();
              }

              private void createChannel() {

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL,
                              "מיקום חפ״ק",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          );

                      NotificationManager nm =
                          getSystemService(
                              NotificationManager.class
                          );

                      if (nm != null) {

                          nm.createNotificationChannel(
                              channel
                          );
                      }
                  }
              }

              private Notification notification(
                  String text
              ) {

                  Intent open =
                      new Intent(
                          this,
                          MainActivity.class
                      );

                  PendingIntent pi =
                      PendingIntent.getActivity(
                          this,
                          0,
                          open,
                          PendingIntent
                              .FLAG_UPDATE_CURRENT
                          |
                          PendingIntent
                              .FLAG_IMMUTABLE
                      );

                  Notification.Builder builder;

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      builder =
                          new Notification.Builder(
                              this,
                              CHANNEL
                          );

                  } else {

                      builder =
                          new Notification.Builder(
                              this
                          );
                  }

                  return builder
                      .setContentTitle(
                          "🔥 חפ״ק שריפה – "
                          + workerName
                      )
                      .setContentText(text)
                      .setSmallIcon(
                          android.R.drawable
                              .ic_menu_mylocation
                      )
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build();
              }

              private void updateNotification(
                  String text
              ) {

                  NotificationManager nm =
                      (NotificationManager)
                          getSystemService(
                              NOTIFICATION_SERVICE
                          );

                  if (nm != null) {

                      nm.notify(
                          7001,
                          notification(text)
                      );
                  }
              }

              @Override
              public void onDestroy() {

                  if (manager != null) {

                      try {

                          manager.removeUpdates(
                              this
                          );

                      } catch (
                          Exception ignored
                      ) {}
                  }

                  executor.shutdown();

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                  Intent intent
              ) {

                  return null;
              }
          }
          EOF

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fire-Command-Worker-APK-v2
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
