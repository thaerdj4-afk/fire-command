name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/firecommand/worker

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "FireCommandWorker"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.firecommand.worker'
            compileSdk 34
            defaultConfig {
              applicationId 'com.firecommand.worker'
              minSdk 26
              targetSdk 34
              versionCode 13
              versionName '13.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <queries><intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent></queries>
            <application
              android:allowBackup="true"
              android:usesCleartextTraffic="false"
              android:label="חפ״ק שריפה - עובד"
              android:supportsRtl="true"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="https" android:host="thaerdj4-afk.github.io" android:path="/fire-command/worker.html"/>
                </intent-filter>
              </activity>
              <service android:name=".LocationService" android:exported="false"
                android:foregroundServiceType="location"/>
            </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/firecommand/worker/MainActivity.java <<'EOF'
          package com.firecommand.worker;
          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.webkit.*;
          import android.widget.Toast;
          import org.json.JSONObject;
          
          public class MainActivity extends Activity {
            static final String BASE="https://thaerdj4-afk.github.io/fire-command/worker.html";
            WebView web; String currentEvent="",pendingEvent="",pendingName="";
            ValueCallback<Uri[]> fileCallback; Uri cameraUri;
            boolean starting=false, explicitStart=true;
            @Override public void onCreate(Bundle state){
              super.onCreate(state);
              getWindow().setStatusBarColor(Color.rgb(4,19,33));
              getWindow().setNavigationBarColor(Color.rgb(4,19,33));
              web=new WebView(this);web.setBackgroundColor(Color.rgb(4,19,33));setContentView(web);
              web.getSettings().setJavaScriptEnabled(true);web.getSettings().setDomStorageEnabled(true);
              web.getSettings().setAllowFileAccess(false);web.getSettings().setAllowContentAccess(true);
              web.getSettings().setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              web.addJavascriptInterface(new Bridge(),"FireWorker");
              web.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){
                  Uri uri=request.getUrl();
                  if(trusted(uri)){currentEvent=eventFrom(uri);return false;}
                  if("https".equals(uri.getScheme())||"tel".equals(uri.getScheme())){
                    try{startActivity(new Intent(Intent.ACTION_VIEW,uri));}catch(Exception e){toast("לא נמצאה אפליקציה לפתיחת הקישור");}
                  }
                  return true;
                }
              });
              web.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onJsAlert(WebView v,String u,String message,JsResult result){
                  new AlertDialog.Builder(MainActivity.this).setMessage(message).setPositiveButton("אישור",(d,w)->result.confirm()).setOnCancelListener(d->result.cancel()).show();return true;
                }
                @Override public boolean onJsConfirm(WebView v,String u,String message,JsResult result){
                  new AlertDialog.Builder(MainActivity.this).setMessage(message).setPositiveButton("אישור",(d,w)->result.confirm()).setNegativeButton("ביטול",(d,w)->result.cancel()).setOnCancelListener(d->result.cancel()).show();return true;
                }
                @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> callback,FileChooserParams params){
                  if(fileCallback!=null)fileCallback.onReceiveValue(null);fileCallback=callback;
                  Intent pick=new Intent(Intent.ACTION_GET_CONTENT).setType("image/*").addCategory(Intent.CATEGORY_OPENABLE);
                  Intent chooser=Intent.createChooser(pick,"צילום או בחירת תמונה");
                  try{
                    ContentValues values=new ContentValues();values.put(MediaStore.Images.Media.DISPLAY_NAME,"fire-"+System.currentTimeMillis()+".jpg");values.put(MediaStore.Images.Media.MIME_TYPE,"image/jpeg");
                    cameraUri=getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,values);
                    if(cameraUri!=null){Intent camera=new Intent(MediaStore.ACTION_IMAGE_CAPTURE);camera.putExtra(MediaStore.EXTRA_OUTPUT,cameraUri);camera.setClipData(ClipData.newRawUri("photo",cameraUri));camera.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION);if(camera.resolveActivity(getPackageManager())!=null)chooser.putExtra(Intent.EXTRA_INITIAL_INTENTS,new Intent[]{camera});}
                    startActivityForResult(chooser,2026);
                  }catch(Exception e){callback.onReceiveValue(null);fileCallback=null;toast("לא ניתן לפתוח מצלמה או גלריה");}
                  return true;
                }
              });
              String incoming=eventFrom(getIntent().getData());
              currentEvent=incoming.isEmpty()?getSharedPreferences("worker",MODE_PRIVATE).getString("event",""):incoming;
              loadEvent(currentEvent);
            }
            boolean trusted(Uri u){return "https".equals(u.getScheme())&&"thaerdj4-afk.github.io".equals(u.getHost())&&"/fire-command/worker.html".equals(u.getPath());}
            String eventFrom(Uri u){if(u==null||!trusted(u))return "";String e=u.getQueryParameter("event");return e!=null&&e.matches("[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}")?e:"";}
            void loadEvent(String event){currentEvent=event;web.loadUrl(BASE+"?native=1"+(event.isEmpty()?"":"&event="+Uri.encode(event)));}
            @Override protected void onNewIntent(Intent intent){super.onNewIntent(intent);setIntent(intent);String next=eventFrom(intent.getData());if(next.isEmpty()||next.equals(currentEvent))return;
              new AlertDialog.Builder(this).setMessage("לעבור לאירוע החדש? שיתוף המיקום באירוע הקודם יופסק.").setPositiveButton("מעבר",(d,w)->{stopNative();loadEvent(next);}).setNegativeButton("ביטול",null).show();
            }
            class Bridge {
              @JavascriptInterface public void startLocation(String event,String name){runOnUiThread(()->prepare(event,name,true));}
              @JavascriptInterface public void resumeLocation(String event,String name){runOnUiThread(()->prepare(event,name,false));}
              @JavascriptInterface public String locationMessage(){return getSharedPreferences("worker",MODE_PRIVATE).getString("locationMessage","ממתין למיקום…");}
              @JavascriptInterface public void stopLocation(){runOnUiThread(()->stopNative());}
            }
            void prepare(String event,String name,boolean explicit){
              if(!event.equals(currentEvent)||name.trim().isEmpty()||starting)return;
              android.content.SharedPreferences saved=getSharedPreferences("worker",MODE_PRIVATE);
              if(!explicit&&!saved.getBoolean("sharing",false)){state("stopped","שיתוף המיקום מופסק");return;}
              
              pendingEvent=event;pendingName=name;starting=true;explicitStart=explicit;
              if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED&&checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)!=PackageManager.PERMISSION_GRANTED){requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION},100);return;}
              startNative();
            }
            void startNative(){try{
              android.content.SharedPreferences saved=getSharedPreferences("worker",MODE_PRIVATE);
              if(!pendingEvent.equals(saved.getString("event","")))stopService(new Intent(this,LocationService.class));
              saved.edit().putString("event",pendingEvent).putString("name",pendingName).putBoolean("eventEnded",false).putBoolean("sharing",true).apply();
              Intent i=new Intent(this,LocationService.class).setAction(explicitStart?"START_SHARING":"RESUME_SHARING").putExtra("event",pendingEvent).putExtra("name",pendingName);startForegroundService(i);
              state("waiting","ממתין לאות GPS…");
            }catch(Exception e){state("stopped","לא ניתן להפעיל מיקום: "+e.getMessage());}finally{starting=false;}}
            void stopNative(){getSharedPreferences("worker",MODE_PRIVATE).edit().putBoolean("sharing",false).apply();stopService(new Intent(this,LocationService.class));state("stopped","שיתוף המיקום מופסק");}
            void state(String state,String message){if(web!=null)web.evaluateJavascript("window.workerLocationState&&window.workerLocationState("+JSONObject.quote(state)+","+JSONObject.quote(message)+")",null);}
            void toast(String text){Toast.makeText(this,text,Toast.LENGTH_LONG).show();}
            @Override public void onRequestPermissionsResult(int req,String[] permissions,int[] results){super.onRequestPermissionsResult(req,permissions,results);if(req==100){if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED||checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)==PackageManager.PERMISSION_GRANTED)startNative();else{starting=false;state("stopped","הרשאת המיקום לא אושרה. ניתן להפעיל שיתוף בהמשך.");}}}
            @Override protected void onActivityResult(int req,int result,Intent data){super.onActivityResult(req,result,data);if(req!=2026||fileCallback==null)return;Uri[] out=null;if(result==RESULT_OK){if(data!=null&&data.getData()!=null)out=new Uri[]{data.getData()};else if(cameraUri!=null)out=new Uri[]{cameraUri};}if(cameraUri!=null&&(out==null||!cameraUri.equals(out[0])))try{getContentResolver().delete(cameraUri,null,null);}catch(Exception ignored){}cameraUri=null;fileCallback.onReceiveValue(out);fileCallback=null;}
            @Override public void onBackPressed(){moveTaskToBack(true);}
          }
          EOF

          cat > android-app/app/src/main/java/com/firecommand/worker/LocationService.java <<'EOF'
          package com.firecommand.worker;

          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.location.*;
          import android.os.*;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.*;
          import java.util.concurrent.*;

          public class LocationService extends Service implements LocationListener {
            static final String CHANNEL="fire_worker_location";
            static final String SUPABASE="https://jvubjwzzikfwsektifzi.supabase.co";
            static final String KEY="sb_publishable_2sysk85O-l18YM_EAIaMJg_RAks_tpW";
            LocationManager manager;
            ExecutorService executor=Executors.newSingleThreadExecutor();
            String eventId="",workerName="",workerId=null;
            volatile boolean ready=false, destroyed=false;
            volatile Location latestLocation;
            final java.util.concurrent.atomic.AtomicBoolean sending=new java.util.concurrent.atomic.AtomicBoolean(false);
            final Handler checks=new Handler(Looper.getMainLooper());
            boolean checksStarted=false;

            @Override public void onCreate(){super.onCreate();createChannel();}

            @Override public int onStartCommand(Intent intent,int flags,int startId){
              if(intent!=null && "STOP_SHARING".equals(intent.getAction())){
                getSharedPreferences("worker",MODE_PRIVATE).edit().putBoolean("sharing",false).apply();
                executor.execute(()->{clearRemoteLocation();stopForeground(true);stopSelf();}); return START_NOT_STICKY;
              }
              boolean explicitStart=intent!=null && "START_SHARING".equals(intent.getAction());
              if(intent!=null){
                String e=intent.getStringExtra("event"),n=intent.getStringExtra("name");
                if(e!=null)eventId=e.trim(); if(n!=null)workerName=n.trim();
                getSharedPreferences("worker",MODE_PRIVATE).edit().putString("event",eventId).putString("name",workerName).apply();
              }else{
                eventId=getSharedPreferences("worker",MODE_PRIVATE).getString("event","");
                workerName=getSharedPreferences("worker",MODE_PRIVATE).getString("name","");
              }
              if(explicitStart) getSharedPreferences("worker",MODE_PRIVATE).edit().putBoolean("sharing",true).apply();
              if(!getSharedPreferences("worker",MODE_PRIVATE).getBoolean("sharing",false)){stopSelf();return START_NOT_STICKY;}
              startForeground(7001,notification("🟡 מתחבר למיקום LIVE..."));
              if(ready)return START_STICKY;
              workerId=null;ready=false;
              executor.execute(()->{if(eventFinished()||finished()){getSharedPreferences("worker",MODE_PRIVATE).edit().putBoolean("sharing",false).putBoolean("eventEnded",true).apply();stopSelf();return;}if(explicitStart)authorizeRemoteSharing();findOrCreateWorker();ready=workerId!=null;});
              startGps();
              scheduleChecks();
              return START_STICKY;
            }
            void scheduleChecks(){
              if(checksStarted)return;checksStarted=true;
              checks.postDelayed(new Runnable(){
                @Override public void run(){
                  if(!getSharedPreferences("worker",MODE_PRIVATE).getBoolean("sharing",false))return;
                  executor.execute(()->{
                    if(eventFinished()||finished()){
                      getSharedPreferences("worker",MODE_PRIVATE).edit().putBoolean("sharing",false).putBoolean("eventEnded",true).apply();
                      clearRemoteLocation();updateNotification("⏹ סיום אירוע — המיקום הופסק");stopSelf();return;
                    }
                    if(remoteStopRequested()){
                      getSharedPreferences("worker",MODE_PRIVATE).edit().putBoolean("sharing",false).apply();
                      clearRemoteLocation();updateNotification("🔴 החפ״ק הפסיק שיתוף מיקום");stopSelf();
                    }
                  });
                  flushLocation();
                  checks.postDelayed(this,5000);
                }
              },5000);
            }
            boolean eventFinished(){
              if(eventId.isEmpty())return false;HttpURLConnection c=null;
              try{
                c=conn(SUPABASE+"/rest/v1/rpc/worker_event_state","POST");
                JSONObject b=new JSONObject();b.put("p_event_id",eventId);write(c,b.toString());
                if(ok(c.getResponseCode())){
                  JSONArray a=new JSONArray(read(c));
                  return a.length()>0 && !"active".equals(a.getJSONObject(0).optString("status"));
                }
              }catch(Exception ignored){}finally{if(c!=null)c.disconnect();}return false;
            }

            void startGps(){
              if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED &&
                 checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)!=PackageManager.PERMISSION_GRANTED){
                stopSelf(); return;
              }
              manager=(LocationManager)getSystemService(LOCATION_SERVICE);
              try{if(manager.isProviderEnabled(LocationManager.GPS_PROVIDER))
                manager.requestLocationUpdates(LocationManager.GPS_PROVIDER,5000,0,this);}catch(Exception ignored){}
              try{if(manager.isProviderEnabled(LocationManager.NETWORK_PROVIDER))
                manager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER,5000,0,this);}catch(Exception ignored){}
            }

            @Override public void onLocationChanged(Location l){
              latestLocation=new Location(l);
              flushLocation();
            }
            void flushLocation(){
              if(destroyed||!sending.compareAndSet(false,true))return;
              executor.execute(()->{try{
                if(destroyed||!getSharedPreferences("worker",MODE_PRIVATE).getBoolean("sharing",false))return;
                if(eventFinished()||finished()||remoteStopRequested()){
                  getSharedPreferences("worker",MODE_PRIVATE).edit().putBoolean("sharing",false).apply();
                  clearRemoteLocation();stopSelf();return;
                }
                if(workerId==null)findOrCreateWorker();
                ready=workerId!=null;
                Location l=latestLocation;
                if(ready&&l!=null&&android.os.SystemClock.elapsedRealtimeNanos()-l.getElapsedRealtimeNanos()<60000000000L)
                  updateLocation(l.getLatitude(),l.getLongitude());
              }finally{sending.set(false);}});
            }

            void findOrCreateWorker(){
              if(eventId.isEmpty()||workerName.isEmpty())return;
              HttpURLConnection c=null;
              try{
                String ep=SUPABASE+"/rest/v1/workers?event_id=eq."+URLEncoder.encode(eventId,"UTF-8")
                  +"&name=eq."+URLEncoder.encode(workerName,"UTF-8")
                  +"&select=id,status&order=created_at.desc&limit=10";
                c=conn(ep,"GET");
                if(ok(c.getResponseCode())){
                  JSONArray a=new JSONArray(read(c));
                  for(int i=0;i<a.length();i++){
                    JSONObject o=a.getJSONObject(i);
                    if(!"סיים".equals(o.optString("status"))){workerId=o.optString("id",null);break;}
                  }
                  // Important: if this worker already has a finished row, do NOT recreate it automatically.
                  if(workerId==null && a.length()>0){
                    stopSelf(); return;
                  }
                }
              }catch(Exception ignored){}finally{if(c!=null)c.disconnect();}
              if(workerId==null)createWorker();
            }

            void createWorker(){
              HttpURLConnection c=null;
              try{
                c=conn(SUPABASE+"/rest/v1/workers","POST");
                c.setRequestProperty("Prefer","return=representation");
                JSONObject b=new JSONObject();
                b.put("event_id",eventId);b.put("name",workerName);b.put("status","בדרך");
                write(c,b.toString());
                if(ok(c.getResponseCode())){
                  JSONArray a=new JSONArray(read(c));
                  if(a.length()>0)workerId=a.getJSONObject(0).optString("id",null);
                }
              }catch(Exception ignored){}finally{if(c!=null)c.disconnect();}
            }

            void authorizeRemoteSharing(){
              if(eventId.isEmpty()||workerName.isEmpty())return; HttpURLConnection c=null;
              try{String ep=SUPABASE+"/rest/v1/worker_requests?event_id=eq."+URLEncoder.encode(eventId,"UTF-8")+"&worker_name=eq."+URLEncoder.encode(workerName,"UTF-8")+"&request_type=eq."+URLEncoder.encode("הפסקת שיתוף מיקום","UTF-8")+"&status=eq."+URLEncoder.encode("פעיל","UTF-8");c=conn(ep,"PATCH");JSONObject b=new JSONObject();b.put("status","אושר מחדש");write(c,b.toString());c.getResponseCode();}catch(Exception ignored){}finally{if(c!=null)c.disconnect();}
            }
            boolean remoteStopRequested(){
              if(eventId.isEmpty()||workerName.isEmpty())return false; HttpURLConnection c=null;
              try{String ep=SUPABASE+"/rest/v1/worker_requests?event_id=eq."+URLEncoder.encode(eventId,"UTF-8")+"&worker_name=eq."+URLEncoder.encode(workerName,"UTF-8")+"&request_type=eq."+URLEncoder.encode("הפסקת שיתוף מיקום","UTF-8")+"&status=eq."+URLEncoder.encode("פעיל","UTF-8")+"&select=id&limit=1";c=conn(ep,"GET");if(ok(c.getResponseCode()))return new JSONArray(read(c)).length()>0;}catch(Exception ignored){}finally{if(c!=null)c.disconnect();}return false;
            }

            void clearRemoteLocation(){
              if(eventId.isEmpty()) eventId=getSharedPreferences("worker",MODE_PRIVATE).getString("event","");
              if(workerName.isEmpty()) workerName=getSharedPreferences("worker",MODE_PRIVATE).getString("name","");
              if(eventId.isEmpty()||workerName.isEmpty())return;
              HttpURLConnection c=null;
              try{
                String ep=SUPABASE+"/rest/v1/workers?event_id=eq."+URLEncoder.encode(eventId,"UTF-8")
                  +"&name=eq."+URLEncoder.encode(workerName,"UTF-8")+"&status=neq."+URLEncoder.encode("סיים","UTF-8");
                c=conn(ep,"PATCH");
                c.setRequestProperty("Prefer","return=minimal");
                JSONObject b=new JSONObject();
                b.put("latitude",JSONObject.NULL); b.put("longitude",JSONObject.NULL);
                b.put("location_updated_at",new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSXXX",Locale.US).format(new Date()));
                write(c,b.toString()); c.getResponseCode();
              }catch(Exception ignored){}finally{if(c!=null)c.disconnect();}
            }

            boolean finished(){
              if(workerId==null)return false;
              HttpURLConnection c=null;
              try{
                c=conn(SUPABASE+"/rest/v1/workers?id=eq."+URLEncoder.encode(workerId,"UTF-8")+"&select=status&limit=1","GET");
                if(ok(c.getResponseCode())){
                  JSONArray a=new JSONArray(read(c));
                  return a.length()>0 && "סיים".equals(a.getJSONObject(0).optString("status"));
                }
              }catch(Exception ignored){}finally{if(c!=null)c.disconnect();}
              return false;
            }

            void updateLocation(double lat,double lng){
              if(!getSharedPreferences("worker",MODE_PRIVATE).getBoolean("sharing",false)){ stopSelf(); return; }
              if(finished()){
                updateNotification("🔴 שיתוף המיקום הופסק — העובד סיים");
                stopSelf(); return;
              }
              HttpURLConnection c=null;
              try{
                c=conn(SUPABASE+"/rest/v1/workers?id=eq."+URLEncoder.encode(workerId,"UTF-8"),"PATCH");
                c.setRequestProperty("Prefer","return=representation");
                JSONObject b=new JSONObject();
                b.put("latitude",lat);b.put("longitude",lng);
                b.put("location_updated_at",new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSXXX",Locale.US).format(new Date()));
                write(c,b.toString());
                if(ok(c.getResponseCode())){
                  if(new JSONArray(read(c)).length()>0)updateNotification("🟢 מיקום LIVE פעיל — משותף עם החפ״ק");
                  else updateNotification("לא עודכן מיקום: רשומת העובד לא נגישה");
                }else updateNotification("שליחת מיקום נכשלה: HTTP "+c.getResponseCode());
              }catch(Exception error){updateNotification("שליחת מיקום נכשלה: "+error.getMessage());}finally{if(c!=null)c.disconnect();}
            }

            boolean ok(int c){return c>=200&&c<300;}
            HttpURLConnection conn(String address,String method)throws Exception{
              HttpURLConnection c=(HttpURLConnection)new URL(address).openConnection();
              c.setRequestMethod(method);c.setConnectTimeout(15000);c.setReadTimeout(15000);
              c.setRequestProperty("apikey",KEY);c.setRequestProperty("Authorization","Bearer "+KEY);
              c.setRequestProperty("Content-Type","application/json");
              if("POST".equals(method)||"PATCH".equals(method))c.setDoOutput(true);
              return c;
            }
            void write(HttpURLConnection c,String d)throws Exception{
              try(OutputStream o=c.getOutputStream()){o.write(d.getBytes(StandardCharsets.UTF_8));}
            }
            String read(HttpURLConnection c)throws Exception{
              BufferedReader r=new BufferedReader(new InputStreamReader(c.getInputStream(),StandardCharsets.UTF_8));
              StringBuilder b=new StringBuilder();String line;while((line=r.readLine())!=null)b.append(line);return b.toString();
            }

            void createChannel(){
              if(Build.VERSION.SDK_INT>=26){
                NotificationChannel ch=new NotificationChannel(CHANNEL,"מיקום חפ״ק",NotificationManager.IMPORTANCE_LOW);
                NotificationManager n=getSystemService(NotificationManager.class);if(n!=null)n.createNotificationChannel(ch);
              }
            }
            Notification notification(String text){
              Intent i=new Intent(this,MainActivity.class);
              PendingIntent p=PendingIntent.getActivity(this,0,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
              Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(this,CHANNEL):new Notification.Builder(this);
              return b.setContentTitle("🔥 חפ״ק שריפה – "+workerName).setContentText(text)
                .setSmallIcon(android.R.drawable.ic_menu_mylocation).setContentIntent(p).setOngoing(true).setOnlyAlertOnce(true).build();
            }
            void updateNotification(String t){
              getSharedPreferences("worker",MODE_PRIVATE).edit().putString("locationMessage",t).apply();
              NotificationManager n=(NotificationManager)getSystemService(NOTIFICATION_SERVICE);
              if(n!=null)n.notify(7001,notification(t));
            }
            @Override public void onDestroy(){
              destroyed=true;ready=false;checks.removeCallbacksAndMessages(null);stopForeground(true);
              if(manager!=null)try{manager.removeUpdates(this);}catch(Exception ignored){}
              executor.shutdown();super.onDestroy();
            }
            @Override public IBinder onBind(Intent i){return null;}
          }
          EOF

