name: Test secure worker staging
on:
  workflow_dispatch:
  push:
    branches: [worker-security-staging]
permissions:
  contents: read
jobs:
  test-build:
    if: github.ref == 'refs/heads/worker-security-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Worker security gate
        run: python3 security/check_worker.py
      - name: Browser regression tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Embed exact branch worker
        run: |
          mkdir -p android-app/app/src/main/assets
          cp worker.html android-app/app/src/main/assets/worker.html
          sha256sum worker.html > android-app/app/src/main/assets/worker-source.sha256
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and lint isolated TEST APK and unsigned AAB
        working-directory: android-app
        run: gradle --no-daemon assembleDebug bundleRelease lint --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Fire-Command-Worker-SECURITY-STAGING-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/reports/lint-results*.html
          if-no-files-found: error
