<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול משתמשי חפ״ק</title><style>body{margin:0;padding:20px;background:#071725;color:#edf7ff;font:16px Arial}.box{max-width:950px;margin:auto;background:#102a3d;padding:22px;border-radius:16px}input,button{padding:12px;border-radius:9px;border:1px solid #436b83;background:#16374d;color:white;font:inherit;margin:5px}button{cursor:pointer;background:#086c56}button:disabled{opacity:.5}section{margin-top:20px}article{border:1px solid #35566c;border-radius:12px;padding:12px;margin:9px 0;overflow-wrap:anywhere}.muted{color:#b6c9d6}.bad{background:#8b2631}.warning{color:#ffcc8a}#status{white-space:pre-wrap}</style></head><body><div class="box"><h1>🔐 ניהול משתמשי חפ״ק השריפה</h1><p class="muted">אישור, דחייה וחסימת משתמשים. כניסה למנהלי חפ״ק מורשים בלבד.</p><div id="login"><input id="email" type="email" placeholder="אימייל מנהל" autocomplete="username"><input id="password" type="password" placeholder="סיסמה" autocomplete="current-password"><button id="enter">כניסה</button></div><div id="admin" hidden><p id="who"></p><button id="refresh">🔄 רענון</button><button id="logout">יציאה</button><section><h2>⏳ בקשות ממתינות</h2><div id="pending"></div></section><section><h2>👥 כל בקשות המשתמשים</h2><div id="all"></div></section></div><p id="status" role="status"></p><p class="warning">אישור או חסימה דורשים הרשאות מאובטחות בבסיס הנתונים. אם הפעולה נדחית, אין לעקוף את ההרשאות בדפדפן.</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script><script>
const db=supabase.createClient('https://jvubjwzzikfwsektifzi.supabase.co','sb_publishable_2sysk85O-l18YM_EAIaMJg_RAks_tpW'),$=id=>document.getElementById(id);let manager=null;
function msg(s){$('status').textContent=s}
async function check(){const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){manager=null;$('login').hidden=false;$('admin').hidden=true;return}const r=await db.from('hq_managers').select('user_id').eq('user_id',session.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){manager=null;$('login').hidden=false;$('admin').hidden=true;msg('אין לחשבון זה הרשאת מנהל חפ״ק');return}manager=session.user;$('login').hidden=true;$('admin').hidden=false;$('who').textContent='מחובר: '+manager.email;await load()}
async function load(){if(!manager)return;const r=await db.from('hq_access_requests').select('user_id,email,status').order('created_at',{ascending:false});if(r.error)throw r.error;const rows=r.data||[];$('pending').replaceChildren();$('all').replaceChildren();for(const row of rows){const card=document.createElement('article'),label=document.createElement('div');label.textContent=(row.email||row.user_id)+' — '+(row.status||'pending');card.append(label);for(const [title,state,cls] of [['✅ אישור','approved',''],['❌ דחייה','rejected','bad'],['⛔ חסימה','blocked','bad']]){if(row.status===state)continue;const b=document.createElement('button');b.textContent=title;b.className=cls;b.onclick=()=>change(row,state,b);card.append(b)}$('all').append(card);if(!row.status||row.status==='pending')$('pending').append(card.cloneNode(true));}if(!$('pending').children.length)$('pending').textContent='אין בקשות ממתינות';if(!rows.length)$('all').textContent='אין בקשות';msg('נטענו '+rows.length+' בקשות.');}
async function change(row,state,b){if(!manager)return;if(!confirm('לעדכן את '+row.email+' לסטטוס '+state+'?'))return;b.disabled=true;try{const r=await db.from('hq_access_requests').update({status:state}).eq('user_id',row.user_id).select('user_id');if(r.error)throw r.error;if(!r.data?.length)throw Error('לא עודכנה אף רשומה. ייתכן שאין הרשאה לבצע שינוי.');msg('עודכן: '+row.email);await load()}catch(e){msg('הפעולה נכשלה: '+e.message)}finally{b.disabled=false}}
$('enter').onclick=async()=>{const b=$('enter');b.disabled=true;msg('מתחבר...');try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await check()}catch(e){msg('שגיאה: '+e.message)}finally{b.disabled=false}};
$('refresh').onclick=()=>load().catch(e=>msg('שגיאה: '+e.message));$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};check().catch(e=>msg('שגיאה: '+e.message));
</script></body></html>
