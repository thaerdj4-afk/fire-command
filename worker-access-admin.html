<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול קוד עובד — חפ״ק</title><style>body{background:#081b29;color:#f2f8ff;font:17px Arial;margin:0;padding:25px}.box{max-width:540px;margin:auto;background:#102b40;padding:24px;border-radius:18px}input,button,select{display:block;width:100%;padding:14px;margin:12px 0;font:inherit;box-sizing:border-box;border-radius:9px}button{background:#128b62;color:white;border:0;font-weight:bold}input,select{background:#19384e;color:white;border:1px solid #6b8ba2}#code{font-family:monospace;overflow-wrap:anywhere;background:#092034;padding:16px}small{color:#c1d1dc}#err{color:#ffaaaa}</style></head><body><div class="box"><h2>🔐 קוד גישה לעובדים</h2><p>מנהל מורשה בלבד. הקוד מוצג פעם אחת לאחר יצירה. החלפת קוד מנתקת את כל חיבורי העובדים הקודמים לאירוע.</p><section id="login"><input id="email" type="email" placeholder="אימייל מנהל"><input id="password" type="password" placeholder="סיסמה"><button id="signIn">כניסה</button></section><section id="panel" hidden><label>אירוע פעיל</label><select id="events"></select><button id="rotate">יצירת / החלפת קוד אירוע</button><button id="disable" style="background:#943535">ביטול קוד וניתוק עובדים</button><div id="code" hidden></div><button id="copy" hidden>העתקת הקוד</button><button id="logout" style="background:#33556b">יציאה</button></section><p id="err" role="alert"></p><small>אל תשלחו את הקוד בקישור ציבורי. מומלץ למסור אותו לעובדים בערוץ מאובטח.</small></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://jvubjwzzikfwsektifzi.supabase.co','sb_publishable_2sysk85O-l18YM_EAIaMJg_RAks_tpW');const $=id=>document.getElementById(id);let lastCode='';const error=e=>$('err').textContent=e?.message||String(e);async function ready(){const {data:{session}}=await db.auth.getSession();$('login').hidden=!session;$('panel').hidden=!session;if(!session)return;const role=await db.rpc('is_admin');if(role.error||role.data!==true){await db.auth.signOut();$('login').hidden=false;$('panel').hidden=true;throw Error('גישה למנהלים בלבד')}const {data,error:err}=await db.from('fire_events').select('id,event_number,name,status').eq('status','active');if(err)throw err;$('events').replaceChildren(...(data||[]).map(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=(e.event_number||'')+' — '+(e.name||'אירוע');return o}));}
$('signIn').onclick=async()=>{try{$('err').textContent='';const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;await ready()}catch(e){error(e)}};
$('rotate').onclick=async()=>{try{const id=$('events').value;if(!id)throw Error('אין אירוע פעיל');if(!confirm('החלפת הקוד תנתק את כל חיבורי העובדים לאירוע. להמשיך?'))return;const r=await db.rpc('admin_rotate_worker_event_code',{p_event_id:id});if(r.error)throw r.error;lastCode=r.data;$('code').textContent=lastCode;$('code').hidden=false;$('copy').hidden=false;$('err').textContent='קוד חדש נוצר. העתק ושמור אותו עכשיו.'}catch(e){error(e)}};
$('disable').onclick=async()=>{try{const id=$('events').value;if(!id)throw Error('אין אירוע פעיל');if(!confirm('לבטל קוד ולנתק את כל העובדים מהאירוע?'))return;const r=await db.rpc('admin_disable_worker_event_code',{p_event_id:id});if(r.error)throw r.error;lastCode='';$('code').hidden=true;$('copy').hidden=true;$('err').textContent='הקוד בוטל'}catch(e){error(e)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('err').textContent='הקוד הועתק'}catch(e){error(e)}};
$('logout').onclick=async()=>{lastCode='';$('code').hidden=true;await db.auth.signOut();await ready()};ready().catch(error);
</script></body></html>
