<script>
(async function () {
  try {
    const source =
      "https://raw.githubusercontent.com/thaerdj4-afk/fire-command/" +
      "b528b062e8e6614a1cf80da0df62a569c4c3e4a7/index.html";

    const response = await fetch(source);
    if (!response.ok) throw new Error("HTTP " + response.status);

    let html = await response.text();

    if (!html.trimStart().toLowerCase().startsWith("<!doctype html>")) {
      throw new Error("קובץ החפ״ק לא תקין");
    }

    function replaceRequired(oldText, newText) {
      if (!html.includes(oldText)) {
        throw new Error("לא ניתן להשלים את עדכון החפ״ק");
      }
      html = html.replace(oldText, newText);
    }

    replaceRequired(
      '<input id="eventName" placeholder="שם אירוע">',
      `<input id="eventName" placeholder="שם אירוע">
      <div class="card" style="margin-top:10px;text-align:center">
        <b>מספר אירוע</b>
        <div id="eventNumber" dir="ltr"
          style="font-size:30px;font-weight:bold;letter-spacing:2px">
          —
        </div>
        <button id="copyEventNumber">📋 העתק מספר אירוע</button>
      </div>`
    );

    replaceRequired(
      'function link(){let u=workerUrl();',
      'function link(){$("eventNumber").textContent=ev?.event_number??"—";let u=workerUrl();'
    );

    replaceRequired(
      '["חירום / סכנה","SOS / סכנה"].includes(x.request_type)&&',
      '["פציעה / רפואי","חירום / סכנה","SOS / סכנה"].includes(x.request_type)&&'
    );

    replaceRequired(
      '`⚠ ${activeSOS.worker_name||"עובד"} בסכנה`',
      '`🚨 סכנה / חירום — ${activeSOS.worker_name||"עובד"}`'
    );

    replaceRequired(
      '`SOS מהשטח • ${activeSOS.status||"חדש"}',
      '`${activeSOS.request_type} • ${activeSOS.status||"חדש"}'

    html = html.replace(oldSound[0], `
let alertAudio = null;

function unlockAlertAudio() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    if (!alertAudio) alertAudio = new C();
    if (alertAudio.state === "suspended") {
      alertAudio.resume().catch(() => {});
    }
  } catch {}
}

document.addEventListener(
  "pointerdown", unlockAlertAudio, {passive:true}
);
document.addEventListener("keydown", unlockAlertAudio);

function beep(urgent) {
  try {
    unlockAlertAudio();
    const c = alertAudio;
    if (!c || c.state !== "running") return;

    const notes = urgent
      ? [[0,1046],[.22,784],[.55,1046],[.77,784],
         [1.10,1046],[1.32,784]]
      : [[0,880],[.23,1175]];

    for (const [delay, frequency] of notes) {
      for (const [multiple, volume] of [[1,.13],[2.76,.025]]) {
        const oscillator = c.createOscillator();
        const gain = c.createGain();
        const time = c.currentTime + delay;

        oscillator.type = "sine";
        oscillator.frequency.value = frequency * multiple;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(volume, time + .008);
        gain.gain.exponentialRampToValueAtTime(.0001, time + .65);

        oscillator.connect(gain);
        gain.connect(c.destination);
        oscillator.start(time);
        oscillator.stop(time + .7);
        oscillator.onended = () => {
          oscillator.disconnect();
          gain.disconnect();
        };
      }
    }
  } catch {}
}

$("copyEventNumber").onclick = async () => {
  if (!ev?.event_number) return alert("פתח אירוע קודם");
  const number = String(ev.event_number);
  try {
    await navigator.clipboard.writeText(number);
    $("copyEventNumber").textContent = "✓ המספר הועתק";
    setTimeout(() => {
      $("copyEventNumber").textContent = "📋 העתק מספר אירוע";
    }, 1800);
  } catch {
    prompt("מספר אירוע:", number);
  }
};
`);

    replaceRequired(
      '<div class="card"><h3>🧭 גזרות</h3><div class="small">סמן גבול גזרה על המפה או בחר נקודת מפגש לכל גזרה.</div><div class="row"><button data-s="א">א׳</button><button data-s="ב">ב׳</button><button data-s="ג">ג׳</button></div><div class="row"><button onclick="setSectorPoint(\'א\')">📍 נקודת גזרה א</button><button onclick="setSectorPoint(\'ב\')">📍 נקודת גזרה ב</button><button onclick="setSectorPoint(\'ג\')">📍 נקודת גזרה ג</button></div><button class="green" type="button" onclick="addCustomSector()">➕ גזרה חדשה — כתוב שם ובחר מיקום</button><div id="sectorSetup"></div></div>',

    replaceRequired(
      '<div class="card"><h3>🧭 גזרות</h3><div class="small">כל הגזרות במקום אחד — בחר גזרה לניהול.</div><div id="sectorSetup"></div><button class="green" type="button" onclick="addCustomSector()">➕ הוסף גזרה</button></div>',
      '<div class="card sectorHub"><h3>🧭 גזרות</h3><div id="sectorTabs" class="row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px"></div><div id="sectorSetup"></div></div>'

    replaceRequired(
      'function renderSectorSetup(){let box=$("sectorSetup");if(!box)return;box.innerHTML=sectorNames().map(k=>{let c=sectorConfig(k),p=sectorPosition(k),n=workers.filter(w=>w.status!=="סיים"&&String(w.sector||"")===String(k)).length;return \`<details class="worker" \${k==="א"?"open":""}><summary style="cursor:pointer;font-weight:800;font-size:16px">גזרה \${esc(k)} <span class="small">• 👤 \${esc(c.manager||"ללא מנהל")} • 👥 \${n}</span></summary><div class="small" style="margin-top:8px">\${p?"📍 נקודה הוגדרה":"📍 נקודה לא הוגדרה"}</div><div class="row" style="margin-top:8px"><button data-s="\${esc(k)}">✏️ גבולות</button><button onclick="setSectorPoint(\'\${k}\')">📍 נקודת גזרה</button><button onclick="setSectorManager(\'\${k}\')">👤 מנהל</button><button type="button" onclick="document.getElementById(\'workers\')?.scrollIntoView({behavior:\'smooth\'})">👥 עובדים</button></div></details>\`}).join("");box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{stop();polyKind="sector";polyPts=[];b.dataset.sectorActive="1";window._sectorDrawName=b.dataset.s;$("drawmsg").textContent="גזרה "+b.dataset.s+": סמן גבולות על המפה";map.getContainer().style.cursor="crosshair"})}',
      'let activeSectorTab="א";window.selectSectorTab=k=>{activeSectorTab=k;renderSectorSetup()};function renderSectorSetup(){let box=$("sectorSetup"),tabs=$("sectorTabs");if(!box||!tabs)return;let names=sectorNames();if(!names.includes(activeSectorTab))activeSectorTab=names[0]||"א";tabs.innerHTML=names.map(k=>\`<button type="button" data-sector-tab="\${esc(k)}" style="font-size:20px;font-weight:900;min-height:48px;\${k===activeSectorTab?"border:2px solid #2d9cff;background:#123f72":""}">\${esc(k)}׳</button>\`).join("")+\`<button class="green" type="button" data-sector-add="1" style="font-size:20px;font-weight:900;min-height:48px">＋</button>\`;tabs.querySelectorAll("[data-sector-tab]").forEach(b=>b.addEventListener("click",()=>{activeSectorTab=b.dataset.sectorTab;renderSectorSetup()}));let addBtn=tabs.querySelector("[data-sector-add]");if(addBtn)addBtn.addEventListener("click",()=>addCustomSector());let k=activeSectorTab,c=sectorConfig(k),p=sectorPosition(k),ws=workers.filter(w=>w.status!=="סיים"&&String(w.sector||"")===String(k));box.innerHTML=\`<div class="worker" style="padding:14px"><div class="row" style="justify-content:space-between;align-items:center"><b style="font-size:20px">📍 גזרה \${esc(k)}</b><span class="small">👤 \${esc(c.manager||"ללא מנהל")} • 👥 \${ws.length}</span></div><div class="row" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px"><button data-sector-border="\${esc(k)}" class="green" style="min-height:54px;font-weight:800">✏️ גבולות</button><button onclick="setSectorPoint(\'\${k}\')" class="red" style="min-height:54px;font-weight:800">📍 נקודת גזרה</button><button onclick="setSectorManager(\'\${k}\')" style="min-height:54px;font-weight:800">👤 מנהל גזרה</button><button type="button" onclick="document.getElementById(\'workers\')?.scrollIntoView({behavior:\'smooth\'})" style="min-height:54px;font-weight:800">👥 עובדים בגזרה (\${ws.length})</button></div><div class="small" style="margin-top:12px;padding:10px;border:1px solid #35506b;border-radius:10px">\${p?"✅ נקודת גזרה מוגדרת • "+(+p[0]).toFixed(5)+", "+(+p[1]).toFixed(5):"⚠ נקודת גזרה עדיין לא הוגדרה"}<br>מנהל: \${esc(c.manager||"לא הוגדר")}<br>עובדים: \${ws.length?ws.map(w=>esc(w.name)).join(", "):"אין עובדים משויכים"}</div></div>\`;box.querySelectorAll("[data-sector-border]").forEach(b=>b.onclick=()=>{stop();polyKind="sector";polyPts=[];window._sectorDrawName=b.dataset.sectorBorder;$("drawmsg").textContent="גזרה "+b.dataset.sectorBorder+": סמן גבולות על המפה";map.getContainer().style.cursor="crosshair"})}'
    );

    replaceRequired(
      'עובדים: \${ws.length?ws.map(w=>esc(w.name)).join(", "):"אין עובדים משויכים"}</div></div>\`;',
      'עובדים: \${ws.length?ws.map(w=>esc(w.name)).join(", "):"אין עובדים משויכים"}</div><div style="margin-top:12px;padding:10px;border:1px solid #35506b;border-radius:10px"><b>📤 שיבוץ עובד לגזרה \${esc(k)}</b><div class="row" style="margin-top:8px"><select id="sectorWorkerPick" style="flex:1"><option value="">בחר עובד LIVE</option>\${workers.filter(w=>w.status!=="סיים"&&String(w.sector||"")!==String(k)).map(w=>\`<option value="\${esc(String(w.id))}">\${esc(w.name)}\${w.sector?" • גזרה "+esc(w.sector):""}</option>\`).join("")}</select><button class="green" type="button" onclick="sendSelectedWorkerToSector(\'\${k}\')">📤 שלח לגזרה \${esc(k)}</button></div></div></div>\`;'
    );

    replaceRequired(

      'function renderWorkers(){wl.clearLayers();let a=workers.filter(w=>w.status!=="סיים");let eqNames=["מפוח","דבשת","מרסס גב","משאבה צפה","משאבה טבולה","תיק צינורות"],eqCounts=new Map(eqNames.map(x=>[x,0]));for(const w of a)for(const x of workerEquipment.get(w.name)||[])if(eqCounts.has(x))eqCounts.set(x,eqCounts.get(x)+1);let eqTotal=eqNames.filter(x=>eqCounts.get(x)).map(x=>x+" "+eqCounts.get(x)).join(" | ");$("workers").innerHTML=(eqTotal?\`<div class="small" style="margin-bottom:8px"><b>🎒 ציוד עובדים:</b> \${esc(eqTotal)}</div>\`:"")+'
    );

    replaceRequired(
      '\${f[0]} <b>\${esc(w.name)}</b> • \${esc(w.status||"—")} • \${w.sector?"גזרה "+esc(w.sector):"ללא גזרה"}<br><span class="small">\${f[1]}</span>',
      '\${f[0]} <b>\${esc(w.name)}</b> • \${esc(w.status||"—")} • \${w.sector?"גזרה "+esc(w.sector):"ללא גזרה"}<br><span class="small">🎒 \${esc((workerEquipment.get(w.name)||["ציוד לא דווח"]).join(" + "))}</span><br><span class="small">\${f[1]}</span>'
    );

    replaceRequired(
      'async function live(){if(ev){let phones=await cloud.from("worker_requests").select("worker_name,details").eq("event_id",ev.id).eq("request_type","WhatsApp opt-in").order("created_at",{ascending:false}).limit(500);',
      'async function live(){if(ev){let equipment=await cloud.from("worker_requests").select("worker_name,details").eq("event_id",ev.id).eq("request_type","ציוד עובד").order("created_at",{ascending:false}).limit(500);if(!equipment.error){workerEquipment=new Map();for(let p of equipment.data||[])if(!workerEquipment.has(p.worker_name))workerEquipment.set(p.worker_name,String(p.details||"").split(",").map(x=>x.trim()).filter(Boolean))}let phones=await cloud.from("worker_requests").select("worker_name,details").eq("event_id",ev.id).eq("request_type","WhatsApp opt-in").order("created_at",{ascending:false}).limit(500);'

    replaceRequired(
      'p=>{beep(["פציעה / רפואי","חירום / סכנה","SOS / סכנה"].includes((p.new||{}).request_type));live()}',
      `p=>{
        const x=p.new||{};
        const urgent=["פציעה / רפואי","חירום / סכנה","SOS / סכנה"];
        const ordinary=[
          "⛽ דלק למשאבה","💧 מים","🍴 אוכל",

            }

    <\/script></body>`);
