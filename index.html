let alertAudio = null;

function unlockAlertAudio() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;

function beep(urgent) {

    unlockAlertAudio();
    const c = alertAudio;
    if (!c || c.state !== "running") return;

    const notes = urgent
      ? [[0,1046],[.22,784],[.55,1046],[.77,784],

        oscillator.stop(time + .7);
        oscillator.onended = () => {
          oscillator.disconnect();
          gain.disconnect();
        };
      }
    }
  } catch {}
}
