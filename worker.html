<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ממשק עובד V7</title><style>

<script>
(()=>{"use strict";const $=x=>document.getElementById(x),URL="https://jvubjwzzikfwsektifzi.supabase.co",KEY="sb_publishable_2sysk85O-l18YM_EAIaMJg_RAks_tpW",cloud=window.supabase.createClient(URL,KEY);let ev=null,wid=localStorage.getItem("workerId")||null,watch=null,last=null,timer=null,chan=null;const eid=new URLSearchParams(location.search).get("event"),wn=()=>$("name").value.trim();

let old=JSON.parse(localStorage.getItem("workerLast")||"null");if(old){$("name").value=old.name||"";$("status").value=old.status||"בדרך";$("sector").value=old.sector||""}resolve();
