<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>עובד בשטח LIVE</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12334b,#03101a 45%,#01070c);color:#f5fbff;font-family:Arial;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:18px}.head{padding:18px;border:1px solid #1c5274;border-radius:18px;background:#061b2bcc;box-shadow:0 20px 60px #0008}.live{color:#42e6a4;font-weight:900}.card{margin-top:12px;background:#071b2bdd;border:1px solid #174a69;border-radius:16px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea,button{width:100%;border-radius:12px;border:1px solid #285a78;background:#0a2639;color:white;padding:13px;font-size:16px}button{font-weight:900}.blue{background:#0b69ad}.green{background:#08754f}.amber{background:#8a5a05}.sos{background:linear-gradient(180deg,#ff3542,#9e0914);font-size:23px;padding:20px;border-color:#ff6972;box-shadow:0 0 28px #ff273c55}.photo{background:#104f7e}.status{font-size:13px;color:#a9c8da;margin-top:8px}.ok{color:#53e9ad}.bad{color:#ff7780}.preview{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:9px;display:none}.small{font-size:12px;color:#9bb8c8}h1{margin:0 0 5px;font-size:24px}h3{margin:0 0 10px}</style></head><body><div class="wrap">
<div class="head"><div class="live">● LIVE</div><h1>🔥 צוות שטח — אירוע שריפה</h1><div class="small" id="eventTxt">מתחבר לאירוע...</div></div>
<div class="card"><h3>👤 כניסה לעובד</h3><input id="name" placeholder="שם העובד"><div class="grid" style="margin-top:9px"><select id="status"><option>בדרך</option><option>הגיע</option><option>עובד בשריפה</option><option>בהפסקה</option></select><input id="sector" placeholder="גזרה (אופציונלי)"></div><button class="green" id="saveWorker" style="margin-top:9px">✓ שמור שם / סטטוס / גזרה</button><div id="loc" class="status ok">🟢 המיקום נשלח אוטומטית ע״י האפליקציה ברקע</div></div>
<div class="card"><h3>📸 תמונה מהשטח</h3><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="preview"><textarea id="note" rows="2" placeholder="הערה קצרה לתמונה"></textarea><button class="photo" id="sendPhoto" style="margin-top:8px">📤 שלח תמונה לחפ״ק</button><div id="photoMsg" class="status"></div></div>
<div class="card"><h3>🧰 בקשה מהחפ״ק</h3><div class="grid"><button data-r="💧 מים">💧 מים</button><button data-r="⛽ דלק למשאבה">⛽ דלק</button><button data-r="🍴 אוכל">🍴 אוכל</button><button data-r="🧰 ציוד / עזרה">🧰 ציוד / עזרה</button><button data-r="פציעה / רפואי">🩹 רפואי</button><button data-r="🚒 תגבור">🚒 תגבור</button></div></div><div class="card"><h3>📋 הבקשות שלי</h3><div id="myRequests" class="status">אין בקשות פעילות</div></div>
<div class="card"><button class="sos" id="sos">🆘 אני בסכנה — SOS</button><div class="small" style="margin-top:9px">בלחיצה נשלח לחפ״ק שמך והמיקום האחרון שלך ומופיעה התראה אדומה על המפה.</div></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";const $=x=>document.getElementById(x),URL="https://jvubjwzzikfwsektifzi.supabase.co",KEY="sb_publishable_2sysk85O-l18YM_EAIaMJg_RAks_tpW",cloud=supabase.createClient(URL,KEY),eventId=new URLSearchParams(location.search).get("event");let worker=null,lastLoc=null,watch=null;const msg=(id,t,bad=false)=>{$(id).textContent=t;$(id).className='status '+(bad?'bad':'ok')};
async function eventInfo(){if(!eventId){$('eventTxt').textContent='⚠ קישור ללא מספר אירוע';return}let r=await cloud.from('fire_events').select('*').eq('id',eventId).maybeSingle();$('eventTxt').textContent=r.data?`אירוע: ${r.data.name||'שריפה'}`:'אירוע פעיל'}eventInfo();
async function ensureWorker(){let n=$('name').value.trim();if(!n)throw Error('כתוב שם עובד קודם');if(worker&&worker.name===n)return worker;let f=await cloud.from('workers').select('*').eq('event_id',eventId).eq('name',n).neq('status','סיים').order('location_updated_at',{ascending:false}).limit(1).maybeSingle();if(f.data){worker=f.data;localStorage.setItem('fireWorkerName',n);return worker}let row={event_id:eventId,name:n,status:$('status').value,sector:$('sector').value.trim()||null,location_updated_at:new Date().toISOString()};let r=await cloud.from('workers').insert(row).select().single();if(r.error)throw r.error;worker=r.data;localStorage.setItem('fireWorkerName',n);return worker}
async function pushLoc(pos){lastLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};let w=await ensureWorker(),patch={latitude:lastLoc.lat,longitude:lastLoc.lng,location_updated_at:new Date().toISOString(),status:$('status').value,sector:$('sector').value.trim()||null};let r=await cloud.from('workers').update(patch).eq('id',w.id);if(r.error)throw r.error;msg('loc',`🟢 LIVE • ${lastLoc.lat.toFixed(5)}, ${lastLoc.lng.toFixed(5)} • דיוק ${Math.round(pos.coords.accuracy)} מ׳`)}
$('name').value=new URLSearchParams(location.search).get('name')||localStorage.getItem('fireWorkerName')||'';$('saveWorker').onclick=async()=>{try{let w=await ensureWorker();let r=await cloud.from('workers').update({status:$('status').value,sector:$('sector').value.trim()||null}).eq('id',w.id);if(r.error)throw r.error;msg('loc','🟢 נשמר • המיקום ממשיך מהאפליקציה ברקע')}catch(e){msg('loc','❌ '+e.message,true)}};
$('status').onchange=async()=>{if(worker)await cloud.from('workers').update({status:$('status').value}).eq('id',worker.id)};
async function request(type,details=''){let w=await ensureWorker(),d=details;if(lastLoc&&!d.startsWith('PHOTO|'))d=`LOC|${lastLoc.lat}|${lastLoc.lng}|${details}`;let r=await cloud.from('worker_requests').insert({event_id:eventId,worker_name:w.name,request_type:type,details:d,status:'חדש'});if(r.error)throw r.error;return r}
async function loadMine(){let n=$('name').value.trim();if(!n||!eventId)return;let r=await cloud.from('worker_requests').select('*').eq('event_id',eventId).eq('worker_name',n).order('created_at',{ascending:false}).limit(12);if(r.error)return;let a=r.data||[];$('myRequests').innerHTML=a.length?a.map(x=>`<div style="padding:8px;border-bottom:1px solid #285a78"><b>${x.request_type}</b> — <span class="${x.status==='טופל'?'ok':''}">${x.status||'חדש'}</span></div>`).join(''):'אין בקשות פעילות'}document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{try{b.disabled=true;let old=b.textContent;b.textContent='⏳ שולח...';await request(b.dataset.r);b.textContent='✓ נשלח';await loadMine();setTimeout(()=>{b.textContent=old;b.disabled=false},1400)}catch(e){b.disabled=false;alert('❌ '+e.message)}});setInterval(loadMine,5000);setTimeout(loadMine,400);
$('sos').onclick=async()=>{try{await request('SOS / סכנה','');alert('🆘 SOS נשלח לחפ״ק')}catch(e){alert('❌ '+e.message)}};
$('photo').onchange=()=>{let f=$('photo').files[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'};
async function compress(file){let bmp=await createImageBitmap(file),max=900,sc=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.62)}
$('sendPhoto').onclick=async()=>{try{let f=$('photo').files[0];if(!f)throw Error('בחר תמונה קודם');msg('photoMsg','⏳ שולח תמונה...');let data=await compress(f),note=$('note').value.trim();await request('תמונה מהשטח',`PHOTO|${data}|${note}`);msg('photoMsg','✅ התמונה נשלחה ומופיעה בחפ״ק');$('photo').value='';$('note').value=''}catch(e){msg('photoMsg','❌ '+e.message,true)}};
})();</script></body></html>
